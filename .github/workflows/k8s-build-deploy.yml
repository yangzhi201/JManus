name: "Build and Deploy to Kubernetes"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./tools/github-actions/setup-deps
      - run: make tools
      - run: make ui-build
      - run: make build
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/jmanus
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: azure/setup-kubectl@v4
      - name: Configure kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p ~/.kube
          printf "%s" "$KUBE_CONFIG" > ~/.kube/config
      - name: Set namespace
        run: |
          NS="${{ secrets.K8S_NAMESPACE }}"
          if [ -z "$NS" ]; then NS=default; fi
          echo "NAMESPACE=$NS" >> $GITHUB_ENV
      - name: Apply Kubernetes manifests
        run: kubectl -n "$NAMESPACE" apply -k deploy/k8s
      - name: Update deployment image
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/jmanus:latest"
          kubectl -n "$NAMESPACE" set image deployment/jmanus jmanus="$IMAGE"
      - name: Wait for rollout
        run: kubectl -n "$NAMESPACE" rollout status deployment/jmanus --timeout=180s
